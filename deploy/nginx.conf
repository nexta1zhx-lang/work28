# ============================================================
# TXYK 前端 + 离线瓦片 生产 Nginx 配置（可直接使用）
# ------------------------------------------------------------
# 适用：体系运控分系统前端（Vue history 路由） + 离线卫星瓦片
# 更新：2026-08-25（瓦片已从 public/ 移出到 tiles-data/，见 docs/智能分析数据切换与部署说明.md 2.3）
#
# 方案A（本配置默认，推荐）：瓦片由 Nginx 直接托管 tiles-data/
#   - 前端 dist/ 不含瓦片，构建快、内存低，彻底避免 copy-webpack-plugin OOM
#   - 瓦片 URL 仍是 /sat/{z}/{x}/{y}.jpg 与 /sat_gd/{z}/{x}/{y}.jpg，前端代码零改动
#
# ── 部署步骤（三步）────────────────────────────────────────
#   1) 本地构建前端：
#        npm install && npm run build          # 生成 dist/
#   2) 上传到服务器：
#        rsync -av dist/        /data/txyk/dist/
#        rsync -av tiles-data/  /data/tiles/   # 内部结构 /data/tiles/sat/{z}/{x}/{y}.jpg
#   3) 启用本配置（按下面 TODO 修改实际路径/域名/后端地址）：
#        cp deploy/nginx.conf /etc/nginx/conf.d/txyk.conf
#        nginx -t && nginx -s reload           # 或 systemctl reload nginx
#
# ── 需要按实际环境修改的地方（全文搜索 TODO）───────────────
#   server_name、root（前端 dist）、瓦片 alias 路径、/rest 后端地址
# ============================================================

server {
    listen 80;
    server_name _;                          # TODO: 改成你的域名或 IP

    # ---------- 前端 SPA ----------
    root /data/txyk/dist;                   # TODO: 前端 dist 实际路径
    index index.html;

    # 静态文件直出优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ---------- 文本压缩（js/css/geojson/json；jpg 已压缩不再压）----------
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml;
    gzip_vary on;

    # Vue history 路由：刷新/直链不能 404，必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证每次拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 构建产物 js/css（文件名带 contenthash，可永久缓存）
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- 离线卫星瓦片（方案A：alias 指向独立数据目录）----------
    # 前端请求 /sat/9/391/189.jpg?v=5 → /data/tiles/sat/9/391/189.jpg
    location /sat/ {
        alias /data/tiles/sat/;             # TODO: 瓦片实际路径（sat 子目录）
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /sat_gd/ {
        alias /data/tiles/sat_gd/;          # TODO: 瓦片实际路径（sat_gd 子目录）
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------- 边界 / 海岸线 GeoJSON（仍在 dist 内，随前端发布）----------
    location ~* ^/md/geo/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        gzip on;
    }

    # ---------- 后端接口反代（前后端同域部署时启用）----------
    location /rest/ {
        proxy_pass http://127.0.0.1:8072/;  # TODO: 后端服务地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============================================================
# 可选升级：HTTPS + HTTP/2（瓦片"多而小"，一个连接并发传输提升明显）
#   把上面 listen 80 改为下面这段并配置证书：
#   listen 443 ssl http2;
#   ssl_certificate     /etc/nginx/ssl/txyk.pem;
#   ssl_certificate_key /etc/nginx/ssl/txyk.key;
#   再保留一个 listen 80 用于跳转 https。缓存配置不变。
# ============================================================

# ============================================================
# 方案B（备选）：npm run build:full 把瓦片复制进 dist/ 后，
#   dist/ 里含 sat/、sat_gd/ 子目录，删除上面两个 alias location 即可，
#   前端与瓦片同一 root，任意静态服务器（Nginx/IIS/对象存储）都能整目录托管。
# ============================================================
